# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/test1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${API_DOCS_PATH:/v3/api-docs}

# Application Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=${APP_NAME:enterprise-crud-app}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.example=${APP_LOG_LEVEL:DEBUG}